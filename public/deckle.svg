<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- A sheet of handmade paper: top and bottom trimmed, both sides left
       deckled. Three bites down the right, one long swell up the left — the
       uneven count is the point. Matched lobes read as a machined spool; an
       odd count reads as torn. Kept deep and few rather than fine and many,
       because fine teeth blur into a plain square at favicon size.
       src/components/LibraryGate.tsx carries the same path; keep them in step. -->
