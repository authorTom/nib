# Production:   docker compose up -d          → http://localhost:8080
# Test/dev env: docker compose --profile dev up dev
#               → live-reloading Vite dev server at http://localhost:5173

services:
  web:
    build: .
    image: nib:local
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Containerised test environment: mounts the working tree and runs the Vite
  # dev server with hot reload, so no local Node install is needed.
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      # Keep container node_modules off the host checkout.
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  node_modules:
