# Build and publish the Deckle image to GitHub Container Registry.
# Multi-arch: amd64 + arm64.
#
# Two kinds of build, and the tags keep them apart:
#
#   push to main   -> :edge, :sha-<commit>
#   tag v1.2.3     -> :1.2.3, :1.2, :1, :latest
#
# :latest belongs to releases, not to the branch. Everyone reads it as "the
# newest proper release" — it is the default in compose.yaml and in the README's
# quick start — so pointing it at the tip of main handed every `docker compose
# pull` whatever merged that morning. Tracking main is now a deliberate choice
# (:edge), and the rolling :1.2 and :1 tags let a deployment take fixes without
# taking features.

name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
